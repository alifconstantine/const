name: Computer Use

on:
  push:
    paths:
      - "apps/harness/desktop/**"
      - "packages/agent/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/computer-use.yml"
  pull_request:
    paths:
      - "apps/harness/desktop/**"
      - "packages/agent/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/computer-use.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @const/agent exec vitest run test/desktop-computer.test.ts test/tool-observations.test.ts test/const-system-prompt.test.ts
      - run: pnpm --filter @const/harness-desktop check-types
      - run: pnpm --filter @const/harness-desktop test:computer
